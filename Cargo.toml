[package]
name = "nu_plugin_subtp"
license = "MIT"
authors = ["GrahamJamesAddis"]
keywords = ["nushell", "vtt", "srt", "subtp", "plugin"]
homepage = "https://github.com/Yethal/nu_plugin_subtp"
repository = "https://github.com/Yethal/nu_plugin_subtp"
description = "A nushell plugin for parsing subtitles supported by subtp"
version = "0.1.0"
edition = "2024"
readme = "README.md"
exclude = ["main.tf"]

[[bin]]
name = "nu_plugin_subtp"
bench = false

[dependencies]
nu-plugin = "0.102.0"
nu-protocol = { version = "0.102.0", features = ["plugin"] }
hcl-rs = "0.18.4"
serde_json = "1.0.140"
subtp = "0.2.0"
